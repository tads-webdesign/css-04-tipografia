<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS font-size</title>
    <style>
        .pequeno {
            font-size: 12px;
        }

        .medio {
            font-size: 16px;
        }

        .grande {
            font-size: 24px;
        }

        .relativo {
            font-size: 1.5em;
            /* 1.5 vezes o tamanho da fonte do pai */
        }
    </style>
</head>

<body>
    <header>
        <h1>Exemplo de CSS font-size</h1>
    </header>
    <main>
        <p class="pequeno">Texto pequeno</p>
        <p class="medio">Texto médio</p>
        <p class="grande">Texto grande</p>
        <p class="relativo">Texto com tamanho relativo</p>
    </main>
</body>

</html>
