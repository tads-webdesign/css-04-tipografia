<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de uso do Google Fonts CSS</title>

    <!-- Importando Google Fonts no CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
        }

        h1 {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
        }

        p {
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <header>
        <h1>Exemplo de uso do Google Font CSS</h1>
    </header>
    <main>
        <p>Parágrafo com Google Font</p>
    </main>
</body>

</html>
