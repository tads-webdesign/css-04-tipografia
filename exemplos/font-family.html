<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS font-family</title>
    <style>
        .serif {
            font-family: "Georgia", "Times New Roman", serif;
        }

        .sans-serif {
            font-family: "Arial", "Helvetica", sans-serif;
        }

        .monospace {
            font-family: "Courier New", "Courier", monospace;
        }
    </style>
</head>

<body>
    <header>
        <h1>Exemplo de CSS font-family</h1>
    </header>
    <main>
        <p class="serif">Este texto usa uma fonte serifada.</p>
        <p class="sans-serif">Este texto usa uma fonte sem serifa.</p>
        <p class="monospace">Este texto usa uma fonte monoespaçada.</p>
    </main>
</body>

</html>
