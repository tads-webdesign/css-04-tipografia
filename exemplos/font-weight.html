<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS font-weight</title>
    <style>
        .leve {
            font-weight: 300;
        }

        .normal {
            font-weight: 400;
            /* ou font-weight: normal; */
        }

        .semi-negrito {
            font-weight: 600;
        }

        .negrito {
            font-weight: 700;
            /* ou font-weight: bold; */
        }
    </style>
</head>

<body>
    <header>
        <h1>Exemplo de CSS font-weight</h1>
    </header>
    <main>
        <p class="leve">Texto leve (300)</p>
        <p class="normal">Texto normal (400)</p>
        <p class="semi-negrito">Texto semi-negrito (600)</p>
        <p class="negrito">Texto negrito (700)</p>
    </main>
</body>

</html>
